<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#006bc5"
    />

    <!-- ===================================== -->
    <!-- SEO BÁSICO -->
    <!-- ===================================== -->

    <title>Mega-Mex | Abarrotes y más</title>

    <meta
      name="description"
      content="Mega-Mex - Abarrotes, productos, promociones y novedades para tu hogar. Encuentra todo lo que necesitas en un solo lugar."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="author"
      content="Mega-Mex"
    />

    <meta
      name="language"
      content="es-MX"
    />

    <!-- ===================================== -->
    <!-- FAVICON -->
    <!-- ===================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/logo-mega-mex.png"
    />

    <!-- ===================================== -->
    <!-- OPEN GRAPH (WhatsApp, Facebook, LinkedIn) -->
    <!-- ===================================== -->

    <meta
      property="og:site_name"
      content="Mega-Mex"
    />

    <meta
      property="og:title"
      content="Mega-Mex | Abarrotes y más"
    />

    <meta
      property="og:description"
      content="Mega-Mex - Abarrotes, productos, promociones y novedades para tu hogar. Encuentra todo lo que necesitas en un solo lugar."
    />

    <meta
      property="og:image"
      content="/logo-mega-mex.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="es_MX"
    />

    <!-- ===================================== -->
    <!-- TWITTER CARD -->
    <!-- ===================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Mega-Mex | Abarrotes y más"
    />

    <meta
      name="twitter:description"
      content="Mega-Mex - Abarrotes, productos, promociones y novedades para tu hogar."
    />

    <meta
      name="twitter:image"
      content="/logo-mega-mex.png"
    />

    <!-- ===================================== -->
    <!-- GOOGLE SIGN-IN -->
    <!-- ===================================== -->
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>

    <!-- ===================================== -->
    <!-- FACEBOOK SDK -->
    <!-- ===================================== -->
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: '1406927924239937',
          cookie: true,
          xfbml: true,
          version: 'v19.0'
        })
        window.dispatchEvent(new Event('fb-sdk-ready'))
      }
    </script>

    <script
      async
      defer
      crossorigin="anonymous"
      src="https://connect.facebook.net/es_LA/sdk.js"
    ></script>
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
